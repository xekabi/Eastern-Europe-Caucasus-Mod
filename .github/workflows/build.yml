name: Build Forge 1.20.1 mod
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build and reobfuscate Forge jar
        run: gradle --no-daemon clean build --stacktrace
      - name: Verify output
        run: test -s build/libs/eac16-0.1.0.jar
      - name: Upload installable Forge jar
        uses: actions/upload-artifact@v4
        with:
          name: EAC16-Forge-1.20.1
          path: build/libs/eac16-0.1.0.jar
          if-no-files-found: error
          retention-days: 30
